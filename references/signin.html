<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NextDate - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Animations */
        @keyframes subtlePulse {
            0% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.98); }
        }
        
        .animate-pulse-subtle {
            animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* State Transitions */
        .splash-state {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #FAFAF9;
            z-index: 50;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-state.fade-out {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.02);
        }

        .login-state {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }

        .login-state.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* Input styling */
        .premium-input {
            background: transparent;
            border: 1px solid #E5E5E5;
            transition: all 0.3s ease;
        }
        
        .premium-input:focus {
            border-color: #001A3D;
            box-shadow: 0 0 0 1px #001A3D;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#001A3D",
                        "on-primary": "#ffffff",
                        "background": "#FAFAF9",
                        "on-background": "#1a1c1e",
                        "surface": "#ffffff",
                        "on-surface": "#1A202C",
                        "on-surface-variant": "#64748B",
                        "outline": "#E2E8F0",
                        "outline-variant": "#F1F5F9",
                    },
                    "fontFamily": {
                        "sans": ["Geist", "sans-serif"],
                        "inter": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen flex flex-col overflow-x-hidden selection:bg-primary/20 selection:text-primary">
<!-- Splash Screen -->
<div class="splash-state fade-out" id="splashScreen" style="display: none;">
<div class="flex flex-col items-center">
<div class="w-20 h-20 bg-primary rounded-2xl flex items-center justify-center mb-8 shadow-2xl shadow-primary/20 animate-pulse-subtle">
<span class="material-symbols-outlined text-white text-5xl" data-weight="fill">favorite</span>
</div>
<h1 class="text-4xl font-semibold text-primary tracking-tight mb-12">NextDate</h1>
<div class="w-32 h-[2px] bg-outline-variant overflow-hidden rounded-full">
<div class="h-full bg-primary w-1/3 rounded-full animate-[slideRight_1.5s_ease-in-out_infinite]" style="animation: slideRight 1.5s ease-in-out infinite;"></div>
</div>
</div>
</div>
<!-- Main Login View -->
<div class="login-state flex-1 flex flex-col fade-in" id="loginScreen">
<!-- Top Navigation Header -->
<header class="h-16 flex items-center px-6">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-surface hover:bg-outline-variant hover:scale-105 active:scale-95 transition-all duration-200 focus:outline-none shadow-sm border border-outline-variant" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: &quot;wght&quot; 300;">chevron_left</span>
</button>
</header>
<main class="flex-1 flex flex-col px-6 md:px-12 max-w-md mx-auto w-full pb-12">
<!-- Brand Identity Section -->
<div class="mt-4 mb-10 flex flex-col items-center text-center">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-primary/10">
<span class="material-symbols-outlined text-white text-2xl" data-weight="fill">favorite</span>
</div>
<h1 class="text-2xl font-semibold text-primary tracking-tight">NextDate</h1>
<p class="text-[15px] text-on-surface-variant mt-3 max-w-[280px] leading-relaxed">Sign in to continue your journey toward meaningful connection.</p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-medium text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-14 rounded-xl px-4 premium-input outline-none font-inter text-[15px] text-on-surface placeholder:text-slate-400" id="email" placeholder="alex.morgan@example.com" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-[13px] font-medium text-on-surface-variant" for="password">Password</label>
<a class="text-[13px] font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full h-14 rounded-xl px-4 premium-input outline-none font-inter text-[15px] text-on-surface placeholder:text-slate-400 tracking-wider" id="password" placeholder="••••••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-white rounded-xl text-[16px] font-medium shadow-md hover:shadow-lg shadow-primary/20 hover:bg-[#001430] active:scale-[0.98] transition-all duration-200 mt-4">
                Sign In
            </button>
</div>
<!-- Social Login Separator -->
<div class="my-8 flex items-center gap-4">
<div class="flex-1 h-[1px] bg-outline"></div>
<span class="text-[11px] font-medium text-on-surface-variant uppercase tracking-wider">or sign in with</span>
<div class="flex-1 h-[1px] bg-outline"></div>
</div>
<!-- Social Icons Section -->
<div class="flex justify-center gap-5">
<button class="w-12 h-12 rounded-full border border-outline bg-surface flex items-center justify-center hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="w-12 h-12 rounded-full border border-outline bg-surface flex items-center justify-center hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C4.31 16.92 3.46 11.2 5.56 8.3c1.02-1.42 2.5-2.3 4.12-2.32 1.25.02 2.15.54 2.92.54.76 0 2-.68 3.51-.52 1.26.13 2.53.58 3.33 1.7-3.15 1.88-2.64 6.2.5 7.42-.64 1.76-1.5 3.5-2.81 5.16zM12.03 6.16c-.08-2.69 2.24-5.06 4.83-5.16.27 3.04-2.8 5.4-4.83 5.16z" fill="#000000"></path>
</svg>
</button>
</div>
<!-- Create Account Link -->
<div class="mt-auto text-center pt-10">
<p class="text-[14px] text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-semibold hover:underline transition-all ml-1" href="#">Create Account</a>
</p>
</div>
</main>
</div>
<style>
    @keyframes slideRight {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
    }
</style>
<script>
    // Splash screen logic
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            const login = document.getElementById('loginScreen');
            
            splash.classList.add('fade-out');
            login.classList.add('fade-in');
            
            // Clean up splash screen from DOM after transition
            setTimeout(() => {
                splash.style.display = 'none';
            }, 800);
        }, 2500); // 2.5 second delay
    });

    function togglePasswordVisibility() {
        const input = document.getElementById('password');
        const icon = document.getElementById('password-toggle-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    }
</script>


</body></html>
